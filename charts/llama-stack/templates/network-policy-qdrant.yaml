{{- if and .Values.networkPolicy.enabled .Values.qdrant.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llama-stack.fullname" . }}-qdrant
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-stack.labels" . | nindent 4 }}
    policy.kubernetes.io/type: qdrant
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: qdrant
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "kube-system"
    - podSelector:
        matchLabels:
          k8s-app: "kube-dns"
    ports:
    - protocol: UDP
      port: 53
  # Allow intra-namespace communication only
  - to:
    - podSelector: {}
{{- end }}
