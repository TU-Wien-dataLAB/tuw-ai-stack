{{- if and .Values.networkPolicy.enabled (include "llama-stack.postgresEnabled" .) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "llama-stack.fullname" . }}-cnpg
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llama-stack.labels" . | nindent 4 }}
    policy.kubernetes.io/type: cnpg
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: {{ include "llama-stack.fullname" . }}-postgres
  policyTypes:
    - Egress
  egress:
  # Allow access to Kubernetes API server (required by CNPG operator)
  # CNPG pods need to read the Cluster CRD and communicate with the operator
  - to:
    - ipBlock:
        cidr: {{ .Values.networkPolicy.kubernetesApiCidr | default "172.24.0.1/32" }}
    ports:
    - protocol: TCP
      port: 443
  # Allow DNS resolution
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: "kube-system"
    - podSelector:
        matchLabels:
          k8s-app: "kube-dns"
    ports:
    - protocol: UDP
      port: 53
  # Allow intra-namespace communication (CNPG replication, operator communication)
  - to:
    - podSelector: {}
{{- end }}
