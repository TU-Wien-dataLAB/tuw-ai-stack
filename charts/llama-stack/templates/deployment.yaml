apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llama-stack.fullname" . }}
  labels:
    {{- include "llama-stack.labels" . | nindent 4 }}
    app: {{ .Release.Name }}
  annotations: {}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "llama-stack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "llama-stack.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "llama-stack.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount | default false }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.persistence.enabled }}
      initContainers:
        - name: setup-permissions
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              echo "Setting up OGX data directory..."
              BASE_DIR="{{ .Values.persistence.mountPath }}"
              # Clean up any existing Milvus lock files
              rm -f $BASE_DIR/distributions/tuw-ai/milvus.db/milvus.db.lock
              rm -f $BASE_DIR/distributions/tuw-ai/milvus.db/*.lock
              # Create directory structure
              mkdir -p $BASE_DIR/distributions/tuw-ai/files
              mkdir -p $BASE_DIR/distributions/tuw-ai/milvus.db
              chown -R 1000:1000 $BASE_DIR || echo "Some files couldn't be chowned (expected)"
              echo "Directory structure created successfully"
          volumeMounts:
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath | quote }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ (tpl .Values.image.repository $) }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          args:
            - "--port"
            - "{{ .Values.service.port }}"
          env:
            - name: RUN_CONFIG_PATH
              value: "/etc/ogx/config.yaml"
            - name: QDRANT_URL
              value: "http://{{ .Release.Name }}-qdrant.{{ .Release.Namespace }}.svc.cluster.local:6333"
          {{- if .Values.env }}
            {{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
            - name: SQLITE_STORE_DIR
              value: "/home/lls/.ogx/distributions/tuw-ai"
            - name: HOME
              value: "/home/lls"
          {{- end }}
          {{- if include "llama-stack.postgresEnabled" . }}
            - name: POSTGRES_HOST
              value: {{ printf "%s-postgres-rw.%s.svc.cluster.local" (include "llama-stack.fullname" .) .Release.Namespace | quote }}
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: {{ .Values.cnpg.database | default "llamastack" | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "llama-stack.fullname" . }}-postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llama-stack.fullname" . }}-postgres-app
                  key: password
          {{- end }}
            - name: OGX_PORT
              value: {{ .Values.service.port | quote }}
          {{- if .Values.telemetry.enabled }}
            - name: TELEMETRY_SINKS
              value: {{ .Values.telemetry.sinks | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.telemetry.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.telemetry.otlpProtocol | default "http/protobuf" | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.telemetry.metricsExporter | default "otlp" | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.telemetry.tracesExporter | default "otlp" | quote }}
          {{- end }}
          livenessProbe:
            {{- tpl (toYaml .Values.livenessProbe) $ | nindent 12 }}
          readinessProbe:
            {{- tpl (toYaml .Values.readinessProbe) $ | nindent 12 }}
          startupProbe:
            {{- tpl (toYaml .Values.startupProbe) $ | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/ogx
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data-volume
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
            {{- with .Values.volumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "llama-stack.fullname" . }}-config
        {{- if .Values.persistence.enabled }}
        - name: data-volume
          persistentVolumeClaim:
            claimName: {{ include "llama-stack.fullname" . }}
        {{- end }}
        {{- with .Values.volumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- tpl (toYaml .Values.affinity) $ | nindent 8 }}
      {{- else if .Values.forceSameNode }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "llama-stack.selectorLabels" . | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
