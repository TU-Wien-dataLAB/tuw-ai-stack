# Note: The starter distribution uses built-in configuration
# All providers are configured via environment variables below

# Telemetry configuration
telemetry:
  enabled: false
  serviceName: "otel-collector.openshift-opentelemetry-operator.svc.cluster.local:4318"
  sinks: "console,sqlite,otel"

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

env:
  VLLM_URL: "http://vllm-prod-router-service.vllm.svc.cluster.local/v1"
  VLLM_MAX_TOKENS: "8192"

replicaCount: 1

image:
  repository: ghcr.io/tu-wien-datalab/llama-stack
  tag: main
  pullPolicy: Always

serviceAccount:
  create: false
  automount: true
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Network policy configuration
networkPolicy:
  enabled: true
  # List of namespaces to allow communication with
  # Note: Add the namespace where llama-stack is deployed (e.g., llama-stack-staging)
  # to allow communication with qdrant sub-chart
  allowedNamespaces: []
  # Example:
  # - open-webui
  # - vllm
  # - llama-stack-staging

service:
  type: ClusterIP
  port: 5001

# Deployment strategy configuration
strategy:
  type: Recreate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# Persistence configuration
persistence:
  enabled: true
  storageClass: "" # Use default storage class
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  mountPath: "/home/lls/.llama"

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 8
    memory: 16Gi
  requests:
    cpu: 8
    memory: 16Gi

livenessProbe:
  httpGet:
    path: /v1/health
    port: 5001
readinessProbe:
  httpGet:
    path: /v1/health
    port: 5001
startupProbe:
  httpGet:
    path: /v1/health
    port: 5001
  initialDelaySeconds: 40
  periodSeconds: 10
  failureThreshold: 30


# Llama Stack Configuration
# The configuration is split into modular sections that are combined in the ConfigMap
# This allows updating specific sections (e.g., only registered_resources) between deployments

# Provider configurations
providers:
  inference:
    - provider_id: ${env.VLLM_URL:+vllm}
      provider_type: remote::vllm
      config:
        base_url: ${env.VLLM_URL:=}
        max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
        api_token: ${env.VLLM_API_TOKEN:=fake}
        tls_verify: ${env.VLLM_TLS_VERIFY:=true}
        # Don't set allowed_models - let it discover all models from endpoint
    - provider_id: openai
      provider_type: remote::openai
      config:
        api_key: ${env.OPENAI_API_KEY:=}
        base_url: ${env.OPENAI_BASE_URL:=https://api.openai.com/v1}
  vector_io:
    - provider_id: faiss
      provider_type: inline::faiss
      config:
        persistence:
          namespace: vector_io::faiss
          backend: kv_default
    - provider_id: sqlite-vec
      provider_type: inline::sqlite-vec
      config:
        db_path: ${env.SQLITE_STORE_DIR:=~/.llama/distributions/starter}/sqlite_vec.db
        persistence:
          namespace: vector_io::sqlite_vec
          backend: kv_default
    - provider_id: ${env.QDRANT_URL:+qdrant}
      provider_type: remote::qdrant
      config:
        url: ${env.QDRANT_URL:=}
        api_key: ${env.QDRANT_API_KEY:=}
        persistence:
          namespace: vector_io::qdrant_remote
          backend: kv_default
  files:
    - provider_id: meta-reference-files
      provider_type: inline::localfs
      config:
        storage_dir: ${env.FILES_STORAGE_DIR:=~/.llama/distributions/starter/files}
        metadata_store:
          table_name: files_metadata
          backend: sql_default
  safety:
    - provider_id: llama-guard
      provider_type: inline::llama-guard
      config:
        excluded_categories: []
    - provider_id: code-scanner
      provider_type: inline::code-scanner
  agents:
    - provider_id: meta-reference
      provider_type: inline::meta-reference
      config:
        persistence:
          agent_state:
            namespace: agents
            backend: kv_default
          responses:
            table_name: responses
            backend: sql_default
            max_write_queue_size: 10000
            num_writers: 4
  tool_runtime:
    - provider_id: brave-search
      provider_type: remote::brave-search
      config:
        api_key: ${env.BRAVE_SEARCH_API_KEY:=}
        max_results: 3
    - provider_id: tavily-search
      provider_type: remote::tavily-search
      config:
        api_key: ${env.TAVILY_SEARCH_API_KEY:=}
        max_results: 3
    - provider_id: rag-runtime
      provider_type: inline::rag-runtime
    - provider_id: model-context-protocol
      provider_type: remote::model-context-protocol
  batches:
    - provider_id: reference
      provider_type: inline::reference
      config:
        kvstore:
          namespace: batches
          backend: kv_default

# CloudNativePG cluster configuration
# Only used when storage.backends contains kv_postgres or sql_postgres types
cnpg:
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:17.2
  database: llamastack
  owner: llamastack
  storage:
    size: 10Gi
    # storageClass: ""  # Uses default storage class if omitted
  # resources:
  #   limits:
  #     cpu: 2
  #     memory: 4Gi
  #   requests:
  #     cpu: 1
  #     memory: 2Gi

# Storage configuration
# Default uses SQLite. To use PostgreSQL, replace the backends with
# kv_postgres and sql_postgres types. This automatically provisions
# a CNPG PostgreSQL cluster.
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=~/.llama/distributions/starter}/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=~/.llama/distributions/starter}/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      namespace: prompts
      backend: kv_default
    connectors:
      namespace: connectors
      backend: kv_default

# Registered resources (models, shields, vector DBs, etc.)
registeredResources:
  models:
    - model_id: nomic-ai/nomic-embed-text-v1.5
      provider_id: sentence-transformers
      provider_model_id: nomic-ai/nomic-embed-text-v1.5
      model_type: embedding
      metadata:
        embedding_dimension: 768
  shields:
    - shield_id: llama-guard
      provider_id: ${env.SAFETY_MODEL:+llama-guard}
      provider_shield_id: ${env.SAFETY_MODEL:=}
    - shield_id: code-scanner
      provider_id: ${env.CODE_SCANNER_MODEL:+code-scanner}
      provider_shield_id: ${env.CODE_SCANNER_MODEL:=}
  vector_dbs: []
  datasets: []
  scoring_fns: []
  benchmarks: []
  tool_groups:
    - toolgroup_id: builtin::websearch
      provider_id: tavily-search
    - toolgroup_id: builtin::rag
      provider_id: rag-runtime

# Server configuration
server:
  port: 8321
  host: "0.0.0.0"
  workers: 8

# Vector stores configuration
vectorStores:
  default_provider_id: faiss
  default_embedding_model:
    provider_id: sentence-transformers
    model_id: nomic-ai/nomic-embed-text-v1.5

# Safety configuration
safety:
  default_shield_id: llama-guard

# Qdrant configuration (sub-chart)
qdrant:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 4
      memory: 8Gi
