# Note: The OGX distribution uses built-in configuration
# All providers are configured via environment variables below

# APIs to enable
apis:
  - batches
  - file_processors
  - files
  - inference
  - interactions
  - messages
  - responses
  - tool_runtime
  - vector_io

# Telemetry configuration
telemetry:
  enabled: false
  serviceName: "otel-collector.openshift-opentelemetry-operator.svc.cluster.local:4318"
  sinks: "console,sqlite,otel"

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

env:
  - name: VLLM_URL
    value: "http://vllm-prod-router-service.vllm.svc.cluster.local/v1"
  - name: VLLM_MAX_TOKENS
    value: "8192"

replicaCount: 1

image:
  repository: ghcr.io/tu-wien-datalab/ogx
  tag: main
  pullPolicy: Always

serviceAccount:
  create: false
  automount: false
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsGroup: 1000

# Network policy configuration
networkPolicy:
  enabled: true
  # List of namespaces to allow communication with
  # Note: Add the namespace where OGX is deployed (e.g., ogx-staging)
  # to allow communication with qdrant sub-chart
  allowedNamespaces: []
  # Example:
  # - open-webui
  # - vllm
  # - ogx-staging

service:
  type: ClusterIP
  port: 5001

# Deployment strategy configuration
strategy:
  type: Recreate
  # rollingUpdate:
  #   maxSurge: 25%
  #   maxUnavailable: 25%

# Persistence configuration
persistence:
  enabled: true
  storageClass: "" # Use default storage class
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  mountPath: "/home/lls/.ogx"

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 4
    memory: 8Gi
  requests:
    cpu: 4
    memory: 8Gi

livenessProbe:
  httpGet:
    path: /v1/health
    port: 5001
readinessProbe:
  httpGet:
    path: /v1/health
    port: 5001
startupProbe:
  httpGet:
    path: /v1/health
    port: 5001
  initialDelaySeconds: 40
  periodSeconds: 10
  failureThreshold: 30


# OGX Configuration
# The configuration is split into modular sections that are combined in the ConfigMap
# This allows updating specific sections (e.g., only registered_resources) between deployments

# Provider configurations
providers:
  inference:
    - provider_id: ${env.VLLM_URL:+vllm}
      provider_type: remote::vllm
      config:
        base_url: ${env.VLLM_URL:=}
        max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
        api_token: ${env.VLLM_API_TOKEN:=fake}
        network:
          tls:
            verify: ${env.VLLM_TLS_VERIFY:=true}
        # Don't set allowed_models - let it discover all models from endpoint
    - provider_id: openai
      provider_type: remote::openai
      config:
        api_key: ${env.OPENAI_API_KEY:=}
        base_url: ${env.OPENAI_BASE_URL:=https://api.openai.com/v1}
    - provider_id: sentence-transformers
      provider_type: inline::sentence-transformers
      config:
        trust_remote_code: false
    - provider_id: transformers
      provider_type: inline::transformers
  vector_io:
    - provider_id: faiss
      provider_type: inline::faiss
      config:
        persistence:
          namespace: vector_io::faiss
          backend: kv_default
    - provider_id: sqlite-vec
      provider_type: inline::sqlite-vec
      config:
        db_path: ${env.SQLITE_STORE_DIR:=~/.ogx/distributions/tuw-ai}/sqlite_vec.db
        persistence:
          namespace: vector_io::sqlite_vec
          backend: kv_default
    - provider_id: ${env.QDRANT_URL:+qdrant}
      provider_type: remote::qdrant
      config:
        url: ${env.QDRANT_URL:=}
        api_key: ${env.QDRANT_API_KEY:=}
        persistence:
          namespace: vector_io::qdrant_remote
          backend: kv_default
  files:
    - provider_id: builtin-files
      provider_type: inline::localfs
      config:
        storage_dir: ${env.FILES_STORAGE_DIR:=~/.ogx/distributions/tuw-ai/files}
        metadata_store:
          table_name: files_metadata
          backend: sql_default
  interactions:
    - provider_id: builtin
      provider_type: inline::builtin
      config:
        store:
          table_name: interactions
          backend: sql_default
  messages:
    - provider_id: builtin
      provider_type: inline::builtin
  responses:
    - provider_id: builtin
      provider_type: inline::builtin
      config:
        persistence:
          responses:
            table_name: responses
            backend: sql_default
            max_write_queue_size: 10000
            num_writers: 4
  tool_runtime:
    - provider_id: brave-search
      provider_type: remote::brave-search
      config:
        api_key: ${env.BRAVE_SEARCH_API_KEY:=}
        max_results: 5
    - provider_id: tavily-search
      provider_type: remote::tavily-search
      config:
        api_key: ${env.TAVILY_SEARCH_API_KEY:=}
        max_results: 3
    - provider_id: file-search
      provider_type: inline::file-search
    - provider_id: model-context-protocol
      provider_type: remote::model-context-protocol
  batches:
    - provider_id: reference
      provider_type: inline::reference
      config:
        sqlstore:
          table_name: batches
          backend: sql_default
  file_processors:
    - provider_id: auto
      provider_type: inline::auto

# CloudNativePG cluster configuration
# Only used when storage.backends contains kv_postgres or sql_postgres types
cnpg:
  instances: 1
  image: ghcr.io/cloudnative-pg/postgresql:17.2
  database: llamastack
  owner: llamastack
  storage:
    size: 10Gi
    # storageClass: ""  # Uses default storage class if omitted
  resources:
    limits:
      cpu: '4'
      memory: 8Gi
    requests:
      cpu: '2'
      memory: 4Gi

# Storage configuration
# Default uses SQLite. To use PostgreSQL, replace the backends with
# kv_postgres and sql_postgres types. This automatically provisions
# a CNPG PostgreSQL cluster.
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=~/.ogx/distributions/tuw-ai}/kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: ${env.SQLITE_STORE_DIR:=~/.ogx/distributions/tuw-ai}/sql_store.db
  stores:
    metadata:
      namespace: registry
      backend: kv_default
    inference:
      table_name: inference_store
      backend: sql_default
      max_write_queue_size: 10000
      num_writers: 4
    conversations:
      table_name: openai_conversations
      backend: sql_default
    prompts:
      table_name: prompts
      backend: sql_default
    connectors:
      table_name: connectors
      backend: sql_default

# Registered resources (models, vector DBs, etc.)
registeredResources:
  models:
    - model_id: nomic-ai/nomic-embed-text-v1.5
      provider_id: sentence-transformers
      provider_model_id: nomic-ai/nomic-embed-text-v1.5
      model_type: embedding
      metadata:
        embedding_dimension: 768
    - metadata: {}
      model_id: claude-haiku-4-5-20251001
      provider_id: all
      provider_model_id: auto
      model_type: llm
    - metadata: {}
      model_id: claude-sonnet-4-5-20250514
      provider_id: all
      provider_model_id: auto
      model_type: llm
    - metadata: {}
      model_id: claude-opus-4-6-20260314
      provider_id: all
      provider_model_id: auto
      model_type: llm
  vector_dbs: []

# Server configuration
server:
  port: 8321
  host: "0.0.0.0"
  workers: 1

# Vector stores configuration
vectorStores:
  default_provider_id: faiss
  default_embedding_model:
    provider_id: sentence-transformers
    model_id: nomic-ai/nomic-embed-text-v1.5
  default_reranker_model: null

# Qdrant configuration (sub-chart)
qdrant:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
  resources:
    limits:
      cpu: 4
      memory: 8Gi
    requests:
      cpu: 4
      memory: 8Gi
