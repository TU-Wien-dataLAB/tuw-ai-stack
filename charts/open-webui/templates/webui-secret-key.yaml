{{- /*
Stable WEBUI_SECRET_KEY (JWT signing + OAuth session encryption). Without it the
image generates a key into the container's ephemeral filesystem on every start,
which logs everyone out and orphans stored OAuth sessions after each restart.

Two sources, both producing Secret <secretName> with key WEBUI_SECRET_KEY:
- generate: true       ESO Password generator, generated once (CreatedOnce), never rotated.
- vaultSecretKey: <k>  read property WEBUI_SECRET_KEY of Vault key <k> (e.g. to carry over
                       an existing key so the switch does not log anyone out).
*/}}
{{- with .Values.webuiSecretKey }}
{{- if and .generate .vaultSecretKey }}
{{- fail "webuiSecretKey: set either generate or vaultSecretKey, not both" }}
{{- end }}
{{- if .generate }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .secretName }}
      rewrite:
        - regexp:
            source: "password"
            target: "WEBUI_SECRET_KEY"
{{- else if .vaultSecretKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: datalab-vault
    kind: ClusterSecretStore
  target:
    name: {{ .secretName }}
    deletionPolicy: Retain
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef:
        key: {{ .vaultSecretKey }}
        property: WEBUI_SECRET_KEY
{{- end }}
{{- end }}
