{{- if .Values.webuiSecretKey.generate }}
# Stable WEBUI_SECRET_KEY (JWT signing + OAuth session encryption). Without it the
# image generates a key into the container's ephemeral filesystem on every start,
# which logs everyone out and orphans stored OAuth sessions after each restart.
# CreatedOnce: the value is generated once and never rotated by ESO.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ .Values.webuiSecretKey.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.webuiSecretKey.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.webuiSecretKey.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ .Values.webuiSecretKey.secretName }}
      rewrite:
        - regexp:
            source: "password"
            target: "WEBUI_SECRET_KEY"
{{- end }}
