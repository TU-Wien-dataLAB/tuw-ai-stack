{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "open-webui.name" . }}-postgres
  namespace: {{ include "open-webui.namespace" . }}
  labels:
    {{- include "open-webui.selectorLabels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances | default 1 }}
  imageName: {{ .Values.cnpg.image | default "ghcr.io/cloudnative-pg/postgresql:17.2" }}

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database | default "openwebui" }}
      owner: {{ .Values.cnpg.owner | default "openwebui" }}

  storage:
    size: {{ (.Values.cnpg.storage).size | default "10Gi" }}
    {{- if (.Values.cnpg.storage).storageClass }}
    storageClass: {{ .Values.cnpg.storage.storageClass }}
    {{- end }}

  {{- if .Values.cnpg.resources }}
  resources:
    {{- toYaml .Values.cnpg.resources | nindent 4 }}
  {{- end }}
{{- end }}
